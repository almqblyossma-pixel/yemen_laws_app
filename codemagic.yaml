workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          unzip -o yemen_laws_app.zip
          cd yemen_laws_app || true
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --release
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          fi
    artifacts:
      - build/**/outputs/**/*.apk
      - app/build/outputs/apk/**/*.apk

